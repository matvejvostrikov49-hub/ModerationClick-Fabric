name: Build ModerationClick Fabric

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.4"
            yarn: "1.21.4+build.8"
            loader: "0.16.10"
            fabric_api: "0.119.4+1.21.4"
          - minecraft: "1.21.11"
            yarn: "1.21.11+build.3"
            loader: "0.18.1"
            fabric_api: "0.141.6+1.21.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod
        run: >
          gradle --no-daemon build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pyarn_mappings=${{ matrix.yarn }}
          -Ploader_version=${{ matrix.loader }}
          -Pfabric_version=${{ matrix.fabric_api }}
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ModerationClick-Fabric-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
